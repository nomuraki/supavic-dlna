name: Build Windows release

# Push a tag like v1.0.0 (it must match VERSION in main.py) and this workflow builds
# the portable .zip and the installer .exe and attaches them to a GitHub Release.
# "Run workflow" (manual) builds the same files as downloadable artifacts, without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Read version
        shell: pwsh
        run: |
          $v = python build/preparar.py
          "VERSION=$v" >> $env:GITHUB_ENV
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "Tag ${{ github.ref_name }} does not match VERSION $v in main.py"; exit 1
          }

      - name: Build executable (PyInstaller)
        run: pyinstaller --noconfirm --clean build/SupaVicDLNA.spec --distpath dist --workpath build/tmp

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist/SupaVicDLNA/SupaVicDLNA.exe -ArgumentList "--ping" -PassThru -Wait
          Write-Host "ping exit code (1 = not running, expected): $($p.ExitCode)"
          if (-not (Test-Path dist/SupaVicDLNA/_internal)) { Write-Error "Build output is incomplete"; exit 1 }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/SupaVicDLNA -DestinationPath "dist/SupaVicDLNA-$env:VERSION-portable-win64.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" build/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in ".zip", ".exe" } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Release notes
        shell: pwsh
        run: |
          # Description = this version's section of CHANGELOG.md + the downloads table (docs/release-notes.md)
          $v = $env:VERSION
          $cl = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($cl, "(?ms)^## \[$([regex]::Escape($v))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
          $novedades = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $descargas = (Get-Content docs/release-notes.md -Raw -Encoding utf8) -replace '\{VERSION\}', $v
          "$novedades`n`n---`n`n$descargas" | Set-Content -Encoding utf8 dist/release-notes.md
          Get-Content dist/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: SupaVicDLNA-${{ env.VERSION }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SupaVic DLNA ${{ env.VERSION }}
          body_path: dist/release-notes.md
          files: |
            dist/SupaVicDLNA-Setup-*.exe
            dist/SupaVicDLNA-*-portable-win64.zip
            dist/SHA256SUMS.txt
