name: Docker image

# Push a tag like v1.4.1 and this workflow builds the Docker image for PCs/NAS (amd64) and
# Raspberry Pi / ARM boards (arm64) and publishes it to GitHub's registry:
#   ghcr.io/nomuraki/supavic-dlna:1.4.1, :1.4 and :latest
# "Run workflow" (manual) only builds it, to check it works, without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          v=$(python3 build/preparar.py --version)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$v" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match VERSION $v in main.py"; exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=test,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=SupaVic DLNA
            org.opencontainers.image.description=Music-only DLNA/UPnP server

      - name: Smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: supavic-dlna:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container and wait for it to answer
        run: |
          mkdir -p "$RUNNER_TEMP/musica" "$RUNNER_TEMP/data"
          docker run -d --name smoke --network host \
            -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/musica:/music:ro" supavic-dlna:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8200/api/estado >/dev/null; then echo "Server is up"; ok=1; break; fi
            sleep 2
          done
          docker logs smoke
          docker rm -f smoke
          [ "$ok" = 1 ] || { echo "::error::The server did not start inside the container"; exit 1; }

      - name: Build and publish (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
